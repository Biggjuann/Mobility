# Codemagic CI/CD — builds the Capacitor-wrapped iOS app from client/.
#
# Before this works you must, in the Codemagic UI:
#   1. Connect your Apple Developer account (App Store Connect API key)
#      and create an environment group named "appstore_credentials".
#   2. Set up automatic code signing for bundle id com.mobility.app.
#   3. Add a group "mobility_build" with VITE_API_URL = your Railway API URL.
#
# The native iOS project is generated in CI (it is not committed), so the
# pipeline runs `npx cap add ios` before building.

workflows:
  ios-capacitor:
    name: Mobility iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore_credentials
        - mobility_build
      vars:
        XCODE_WORKSPACE: 'client/ios/App/App.xcworkspace'
        XCODE_SCHEME: 'App'
        BUNDLE_ID: 'com.mobility.app'
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install web dependencies
        script: |
          cd client
          npm ci
      - name: Build web assets
        script: |
          cd client
          npm run build
      - name: Add iOS platform & sync Capacitor
        script: |
          cd client
          npx cap add ios || true
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd client/ios/App
          pod install
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build & sign IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # Uncomment once App Store Connect is configured to auto-upload to TestFlight.
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
      email:
        recipients:
          - jungbrothers@gmail.com
        notify:
          success: true
          failure: true
