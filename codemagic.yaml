# Codemagic CI/CD — builds the Capacitor-wrapped iOS app from client/.
#
# Configured in the Codemagic UI:
#   1. App Store Connect API key (Admin role) connected as an integration named
#      "Mobility ASC". Admin is required so CI can CREATE the signing certificate.
#   2. A variable group "mobility_build" containing VITE_API_URL (Railway API URL).
#
# The "Set up code signing" step explicitly creates (or fetches) the
# distribution certificate + provisioning profile for com.mobility.app using the
# connected API key, adds the certificate to the keychain, and applies the
# profile to the project. The native iOS project is generated in CI.

workflows:
  ios-capacitor:
    name: Mobility iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Mobility ASC
    environment:
      groups:
        - mobility_build
      vars:
        BUNDLE_ID: 'com.mobility.app'
        XCODE_WORKSPACE: 'client/ios/App/App.xcworkspace'
        XCODE_SCHEME: 'App'
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install web dependencies
        script: |
          cd client
          npm ci
      - name: Build web assets
        script: |
          cd client
          npm run build
      - name: Add iOS platform & sync Capacitor
        script: |
          cd client
          npx cap add ios || true
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd client/ios/App
          pod install
      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          # Use a persistent private key (stored as a secure env var) so the same
          # distribution certificate is reused on every build instead of creating
          # throwaway certs whose keys are lost.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create \
            --profiles-directory "$PROFILES_DIR"
          keychain add-certificates
          xcode-project use-profiles --profiles-directory "$PROFILES_DIR"
          ls -la "$PROFILES_DIR"
      - name: Build & sign IPA
        script: |
          # use-profiles doesn't reliably write signing into the Capacitor App
          # target on this Xcode image, so force it on the archive command
          # (highest-precedence build settings). The cert + profile now exist
          # (created in the previous step with the Admin key), so these resolve.
          PROFILE=$(ls -t "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision 2>/dev/null | head -1)
          if [ -z "$PROFILE" ]; then
            PROFILE=$(find "$HOME" "$CM_BUILD_DIR" -name '*.mobileprovision' 2>/dev/null | head -1)
          fi
          echo "Using profile: $PROFILE"
          security cms -D -i "$PROFILE" > /tmp/pp.plist
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/pp.plist)
          TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/pp.plist)
          CERT_SHA=$(security find-identity -v -p codesigning | grep -m1 -Eo '[0-9A-F]{40}')
          echo "Signing with TEAM=$TEAM PROFILE_UUID=$UUID CERT=$CERT_SHA"
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="DEVELOPMENT_TEAM=$TEAM CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE=$UUID CODE_SIGN_IDENTITY=$CERT_SHA"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - jungbrothers@gmail.com
        notify:
          success: true
          failure: true
      # Enable after the app record exists in App Store Connect (next step):
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
