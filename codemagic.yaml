# Codemagic CI/CD — builds the Capacitor-wrapped iOS app from client/.
#
# Configured in the Codemagic UI:
#   1. App Store Connect API key connected as an integration named "Mobility ASC".
#   2. A variable group "mobility_build" containing VITE_API_URL (your Railway API URL).
#
# Signing uses Codemagic-managed automatic signing (the ios_signing block):
# Codemagic keeps a persistent distribution certificate for your team and
# creates/fetches the provisioning profile for com.mobility.app (now that the
# bundle id is registered), then `xcode-project use-profiles` applies it.
# The native iOS project is generated in CI via `npx cap add ios`.

workflows:
  ios-capacitor:
    name: Mobility iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Mobility ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mobility.app
      groups:
        - mobility_build
      vars:
        XCODE_WORKSPACE: 'client/ios/App/App.xcworkspace'
        XCODE_SCHEME: 'App'
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install web dependencies
        script: |
          cd client
          npm ci
      - name: Build web assets
        script: |
          cd client
          npm run build
      - name: Add iOS platform & sync Capacitor
        script: |
          cd client
          npx cap add ios || true
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd client/ios/App
          pod install
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build & sign IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - jungbrothers@gmail.com
        notify:
          success: true
          failure: true
      # Enable after the app record exists in App Store Connect (next step):
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
