# Codemagic CI/CD — builds the Capacitor-wrapped iOS app from client/.
#
# Configured in the Codemagic UI:
#   1. App Store Connect API key (Admin role) connected as an integration named
#      "Mobility ASC". Admin is required so CI can CREATE the signing certificate.
#   2. A variable group "mobility_build" with VITE_API_URL (Railway API URL),
#      VITE_REVENUECAT_IOS_KEY (RevenueCat public key), and CERTIFICATE_PRIVATE_KEY
#      (secure — the persistent signing key).
#
# Capacitor 8 manages native deps with Swift Package Manager (no CocoaPods), and
# generates App.xcodeproj (no .xcworkspace). The native project is created in CI.

workflows:
  ios-capacitor:
    name: Mobility iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Mobility ASC
    environment:
      groups:
        - mobility_build
      vars:
        BUNDLE_ID: 'com.jungbrothers.mobility'
        XCODE_PROJECT: 'client/ios/App/App.xcodeproj'
        # Marketing version (CFBundleShortVersionString). App Store Connect
        # closes a version's train once it's approved/rejected, so bump this
        # for every new App Store release (e.g. 1.0.1, 1.1, 2.0).
        MARKETING_VERSION: '1.0.1'
        XCODE_SCHEME: 'App'
      node: 22
      xcode: latest
    scripts:
      - name: Install web dependencies
        script: |
          cd client
          npm ci
      - name: Build web assets
        script: |
          cd client
          npm run build
      - name: Add iOS platform & sync Capacitor
        script: |
          cd client
          npx cap add ios || true
          npx cap sync ios
      - name: Mark app as iPhone-only
        script: |
          # Capacitor scaffolds a Universal (iPhone + iPad) app; restrict to
          # iPhone so App Store Connect doesn't require iPad screenshots.
          sed -i '' 's|TARGETED_DEVICE_FAMILY = "1,2";|TARGETED_DEVICE_FAMILY = "1";|g' \
            client/ios/App/App.xcodeproj/project.pbxproj
          grep -n 'TARGETED_DEVICE_FAMILY' client/ios/App/App.xcodeproj/project.pbxproj | head -4
      - name: Allow external loads in the WebView
        script: |
          # Capacitor 8's default Info.plist omits NSAppTransportSecurity, so
          # iOS strict-ATS silently blocks external <img> / fetch in the
          # WKWebView even when the same HTTPS URLs work in Safari. Inject the
          # web-content arbitrary-loads exception (the same key Capacitor 6
          # used to ship by default) so drill images and other Railway-hosted
          # assets load inside the app. Idempotent — safe to re-run.
          PLIST=client/ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoadsInWebContent bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$PLIST"
      - name: Generate app icon set
        script: |
          # Replace Capacitor's placeholder icon with the real one in
          # client/resources/icon.png. The generator writes the full iOS icon
          # set into ios/App/App/Assets.xcassets/AppIcon.appiconset/.
          cd client
          npx capacitor-assets generate --ios \
            --iconBackgroundColor '#14110d' \
            --iconBackgroundColorDark '#14110d'
      - name: Resolve Swift Package dependencies
        script: |
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -resolvePackageDependencies
      - name: Set marketing version
        script: |
          # CFBundleShortVersionString — bump in env vars above when you start
          # a new App Store version. App Store Connect rejects re-uploads on a
          # closed version "train".
          cd client/ios/App
          agvtool new-marketing-version "$MARKETING_VERSION"
      - name: Set build number
        script: |
          # CFBundleVersion — must be unique + increasing per upload. Uses
          # Codemagic's auto-incrementing build counter.
          cd client/ios/App
          agvtool new-version -all "${BUILD_NUMBER:-1}"
      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          # Persistent private key (secure env var) so the same distribution
          # certificate is reused on every build.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
      - name: Build & sign IPA
        script: |
          # Force manual signing on the archive command (highest precedence) since
          # use-profiles doesn't reliably write it into the Capacitor App target.
          PROFILE=$(ls -t "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision 2>/dev/null | head -1)
          if [ -z "$PROFILE" ]; then
            PROFILE=$(find "$HOME" "$CM_BUILD_DIR" -name '*.mobileprovision' 2>/dev/null | head -1)
          fi
          echo "Using profile: $PROFILE"
          security cms -D -i "$PROFILE" > /tmp/pp.plist
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/pp.plist)
          TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/pp.plist)
          CERT_SHA=$(security find-identity -v -p codesigning | grep -m1 -Eo '[0-9A-F]{40}')
          echo "Signing with TEAM=$TEAM PROFILE_UUID=$UUID CERT=$CERT_SHA"
          # NOTE: do not pass PROVISIONING_PROFILE via --archive-flags — it would
          # apply to all targets (including SPM packages like RevenueCat which
          # cannot have a profile). The profile is written into the App target's
          # pbxproj by the earlier `xcode-project use-profiles` step.
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="DEVELOPMENT_TEAM=$TEAM CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=$CERT_SHA" \
          || {
            echo "=== ARCHIVE FAILED — xcodebuild error lines ==="
            grep -h -E "error:|error |fatal|ld: |Undefined symbol|requires a higher|not found" /tmp/xcodebuild_logs/*.log 2>/dev/null | tail -n 60
            echo "=== last 80 log lines ==="
            tail -n 80 /tmp/xcodebuild_logs/*.log 2>/dev/null
            exit 1
          }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - jungbrothers@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
