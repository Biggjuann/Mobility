# Codemagic CI/CD — builds the Capacitor-wrapped iOS app from client/.
#
# Configured in the Codemagic UI:
#   1. App Store Connect API key connected as an integration named "Mobility ASC".
#   2. A variable group "mobility_build" containing VITE_API_URL (your Railway API URL).
#
# Signing: the "Set up code signing" step uses the connected API key to register
# the bundle id, create a distribution certificate + provisioning profile if they
# don't exist yet (--create), then applies them. The native iOS project is
# generated in CI (it is not committed), so the pipeline runs `npx cap add ios`.

workflows:
  ios-capacitor:
    name: Mobility iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Mobility ASC
    environment:
      groups:
        - mobility_build
      vars:
        BUNDLE_ID: 'com.mobility.app'
        XCODE_WORKSPACE: 'client/ios/App/App.xcworkspace'
        XCODE_SCHEME: 'App'
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install web dependencies
        script: |
          cd client
          npm ci
      - name: Build web assets
        script: |
          cd client
          npm run build
      - name: Add iOS platform & sync Capacitor
        script: |
          cd client
          npx cap add ios || true
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd client/ios/App
          pod install
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles \
            --project "client/ios/App/App.xcodeproj"
          echo "--- App target signing settings ---"
          xcodebuild -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" -showBuildSettings 2>/dev/null | grep -Ei 'CODE_SIGN_STYLE|PROVISIONING_PROFILE|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY' | sort -u || true
      - name: Build & sign IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - jungbrothers@gmail.com
        notify:
          success: true
          failure: true
      # Enable after the app record exists in App Store Connect (next step):
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
